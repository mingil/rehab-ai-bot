name: Publish Docker Image & Run Tests

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    name: Run Tests & Publish Docker Image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: kimmingil
      DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.KIMMINGIL || secrets.DOCKER_TOKEN || secrets.DOCKERHUB_PASSWORD || vars.DOCKERHUB_TOKEN || vars.KIMMINGIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & Run unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          PYTHONPATH=src python -m pytest tests/test_bot.py -v

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_PASS != '' }}
        uses: docker/login-action@v3
        with:
          username: kimmingil
          password: ${{ env.DOCKERHUB_PASS }}

      - name: Extract Docker metadata (GHCR + Docker Hub)
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_PASS != '' }}
        id: meta_both
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/kimmingil/rehab-ai-bot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v2.0.1,enable={{is_default_branch}}
            type=raw,value=v2.0.0,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Extract Docker metadata (GHCR Only fallback)
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_PASS == '' }}
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v2.0.1,enable={{is_default_branch}}
            type=raw,value=v2.0.0,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta_both.outputs.tags || steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_both.outputs.labels || steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README.md to Docker Hub Description
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_PASS != '' }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: kimmingil
          password: ${{ env.DOCKERHUB_PASS }}
          repository: kimmingil/rehab-ai-bot
          readme-filepath: ./README.md
